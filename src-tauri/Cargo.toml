[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
# "multipart" is for the speech-to-text upload in ai/voice.rs — /audio/transcriptions
# is a file upload, not a JSON body.
# "gzip" is for the search sources in web/sources.rs — the StackExchange API
# returns gzip unconditionally, ignoring Accept-Encoding, so without it the
# response body is compressed bytes rather than JSON.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls", "gzip"] }
chrono = "0.4"
base64 = "0.22"
# "bundled" compiles SQLite from source into the binary rather than linking
# whatever the machine happens to have — the point of this whole design is that
# a user installs nothing extra, and it also guarantees FTS5 is compiled in
# (it is not universally enabled in system SQLite builds).
rusqlite = { version = "0.32", features = ["bundled"] }
# Attachment text extraction — see content/documents.rs.
#
# calamine reads xlsx/xls (shared strings, several sheets, number formats: not
# worth hand-rolling). pdf-extract handles PDF, where the work is font encodings
# and text positioning rather than the container.
#
# docx and pptx are NOT crates: both are a zip of XML, and the text is one
# element type in one file, so they are read directly with the zip + quick-xml
# below. The alternatives were docx-rust (little used, weak on tables) and undoc
# (young, and pulls tokio into a deliberately blocking codebase) — more
# dependency and more risk than the ~80 lines they would replace.
#
# csv/tsv need nothing at all: a CSV is already text, and the text path reads it.
calamine = "0.36"
pdf-extract = "0.12"
# Pinned to the versions calamine already builds, so making them direct
# dependencies costs no extra compilation.
#
# zip's default features add zstd (a C binding via zstd-sys) and AES decryption,
# neither of which an Office file needs — "deflate" is what these containers
# actually use, and it is what calamine asks for too.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
tauri-plugin-clipboard-manager = "2.3.2"
# HTML parsing for the web tools (web/fetch.rs). A real parser rather than
# regex because the input is arbitrary pages off the internet, where unclosed
# tags and attributes containing '<' are normal rather than exceptional.
#
# `readability` would have done main-content extraction for us, but it was last
# published in 2023 against html5ever 0.26 and carries an optional reqwest 0.11
# — a second copy of a crate this app already depends on at 0.12. scraper is
# current, far more used, and the content selection it doesn't do is ~40 lines
# (see pick_content_root).
scraper = "0.27"
# scraper's node tree, needed by name because scraper does not re-export it and
# the walk in web/extract.rs has to skip whole subtrees (which the ElementRef
# text iterator cannot do). Pinned to what scraper itself resolves — two copies
# of this would be two incompatible tree types.
ego-tree = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Storage_Streams",
] }

