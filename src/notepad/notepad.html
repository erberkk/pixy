<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="notepad.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notepad</title>
    <script type="module" src="./notepad.js" defer></script>
  </head>

  <body>
    <div id="titlebar" data-tauri-drag-region>
      <span id="titlebar-title" data-tauri-drag-region>Notepad</span>
      <div id="titlebar-controls">
        <button class="titlebar-btn" id="titlebar-minimize" title="Minimize">
          <svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="titlebar-btn" id="titlebar-maximize" title="Maximize">
          <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="titlebar-btn" id="titlebar-close" title="Close">
          <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </div>

    <div class="drop-overlay" id="dropOverlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      <p>Drop to open as a note</p>
    </div>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="wordmark">notes<span class="cursor"></span></div>
          <button class="icon-btn" id="collapseBtn" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
        </div>

        <div class="folder-row" id="folderRow" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
          <span id="folderPath">…</span>
          <button class="icon-btn" id="changeFolderBtn" title="Change notes folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
          <button class="icon-btn" id="openFileBtn" title="Open an existing .txt/.md file from anywhere">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2h6M16 16l3 3 3-3M19 19v-7"/></svg>
          </button>
        </div>

        <button class="new-note-btn" id="newNoteBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          New note
        </button>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="search-input" id="searchInput" placeholder="Search notes… (Ctrl+K)" />
        </div>

        <div class="notes-list" id="notesList"></div>

        <div class="sidebar-footer">
          <div class="sidebar-footer-row">
            <span id="notesCount">0 notes</span>
            <div class="tools">
              <button class="icon-btn" id="fontToggle" title="Toggle font (mono/sans)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
              </button>
              <button class="icon-btn" id="linesToggle" title="Toggle line numbers">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
              </button>
              <button class="icon-btn" id="trashToggle" title="Trash">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/><path d="M10 11v6M14 11v6"/></svg>
              </button>
            </div>
          </div>
          <div class="sidebar-footer-row">
            <span>new notes save as</span>
            <div class="format-toggle" id="formatToggle">
              <button class="format-toggle-opt" data-ext="txt">txt</button>
              <button class="format-toggle-opt" data-ext="md">md</button>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <button class="icon-btn" id="openSidebarBtn" title="Show sidebar" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <input class="title-input" id="titleInput" placeholder="Untitled note" />
          <button class="ext-badge" id="extBadge" title="Click to convert this note between .txt and .md">.txt</button>
          <div class="toolbar">
            <button class="icon-btn" id="pinBtn" title="Pin note">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5M9 10.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V16a1 1 0 001 1h12a1 1 0 001-1v-.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V7a1 1 0 011-1 1 1 0 001-1V4a1 1 0 00-1-1H8a1 1 0 00-1 1v1a1 1 0 001 1 1 1 0 011 1z"/></svg>
            </button>
            <div class="divider"></div>
            <button class="icon-btn" id="previewBtn" title="Toggle Markdown preview (Ctrl+E) — write **bold**, # headers, - lists, then click here to render it">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="icon-btn-label">MD</span>
            </button>
            <button class="icon-btn" id="focusBtn" title="Focus mode (Ctrl+. or Esc to exit)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3m11-5v3a2 2 0 01-2 2h-3"/></svg>
            </button>
            <button class="icon-btn" id="findBtn" title="Find & replace (Ctrl+F)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </button>
            <div class="divider"></div>
            <button class="icon-btn" id="deleteBtn" title="Move to trash">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6h14z"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </div>

        <!-- Exit-focus button lives OUTSIDE .toolbar so it stays visible/clickable
             while focus mode hides the rest of the toolbar (that was the bug: the
             only way out used to be a keyboard shortcut). -->
        <button class="exit-focus-btn" id="exitFocusBtn" title="Exit focus mode (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Exit focus
        </button>

        <div class="status-row">
          <span class="stat"><b id="wordCount">0</b> words</span>
          <span class="stat"><b id="charCount">0</b> chars</span>
          <span class="stat"><b id="lineCount">1</b> lines</span>
          <span class="stat"><b id="readTime">0 min</b> read</span>
          <span class="stat">Ln <b id="curLine">1</b>, Col <b id="curCol">1</b></span>
          <span class="stat selection" id="selectionStat" style="display:none;">Selected: <b id="selWords">0</b>w / <b id="selChars">0</b>ch</span>
          <div class="save-indicator">
            <span class="save-dot" id="saveDot" title="Saved"></span>
          </div>
        </div>

        <div class="editor-wrap" id="editorWrap">
          <div class="gutter" id="gutter">1</div>
          <textarea class="editor" id="editor" placeholder="Start typing… (supports **bold**, # headers, - lists, [[links]])" spellcheck="false"></textarea>
          <div class="preview" id="preview"></div>

          <div class="find-panel" id="findPanel">
            <div class="find-row">
              <input id="findInput" placeholder="Find" />
              <span class="find-count" id="findCount"></span>
              <button class="mini-btn" id="findNextBtn">Next</button>
            </div>
            <div class="find-row">
              <input id="replaceInput" placeholder="Replace with" />
            </div>
            <div class="find-actions">
              <button class="mini-btn" id="replaceAllBtn">Replace all</button>
              <button class="mini-btn" id="closeFindBtn">Close</button>
            </div>
          </div>

          <div class="empty-state" id="emptyState" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3v5h5M6 3h8l6 6v12H6z"/></svg>
            <p>No note selected</p>
            <p><span class="kbd">Ctrl</span> + <span class="kbd">N</span> to create one, <span class="kbd">Ctrl</span> + <span class="kbd">K</span> for commands</p>
          </div>
        </div>
      </main>
    </div>

    <div class="overlay-backdrop" id="overlayBackdrop"></div>

    <div class="cmdk" id="cmdk">
      <input id="cmdkInput" placeholder="Type a command or search notes…" />
      <div class="cmdk-list" id="cmdkList"></div>
    </div>

    <div class="trash-modal" id="trashModal">
      <div class="trash-head">
        <h3>Trash</h3>
        <button class="icon-btn" id="closeTrashBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="trash-list" id="trashList"></div>
      <div class="trash-foot">
        <button class="mini-btn danger" id="emptyTrashBtn">Empty trash</button>
      </div>
    </div>

    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
      <span id="toastText">Exported</span>
    </div>
  </body>
</html>
